name: Supabase Keep Alive

on:
  schedule:
    # Ping every 3 days (Mon / Thu) at 08:00 UTC.
    # Supabase pauses after 7 days of inactivity — this keeps it alive.
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Run manually from the Actions tab whenever needed

jobs:
  keep-alive:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Hit the Supabase REST health endpoint (no auth required).
      #    We also query the students table with a limit of 1 row so that
      #    the database engine is woken from idle, not just the API edge.
      # ------------------------------------------------------------------
      - name: Ping REST API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Supabase health check returned $STATUS — project may be paused."
          fi

      - name: Wake database with a lightweight query
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/students?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "206" ]; then
            echo "::error::Database ping failed with status $HTTP_CODE. Check the Supabase dashboard."
            exit 1
          fi
          echo "✅ Supabase is alive and responding."

  # -------------------------------------------------------------------------
  # Keep this workflow itself alive.
  # GitHub DISABLES scheduled workflows after 60 days without a repo push.
  # This job commits a tiny timestamp update so the repo stays "active".
  # -------------------------------------------------------------------------
  keep-workflow-alive:
    name: Keep workflow scheduled
    runs-on: ubuntu-latest
    # Only run this self-maintenance step on Mondays (once a week is enough).
    if: github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Touch keep-alive timestamp
        run: |
          mkdir -p .github
          echo "Last keep-alive run: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keep-alive.txt

      - name: Commit timestamp
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          # Only commit if there is actually a change (idempotent)
          git diff --staged --quiet || git commit -m "chore: keep-alive ping [skip ci]"
          git push

