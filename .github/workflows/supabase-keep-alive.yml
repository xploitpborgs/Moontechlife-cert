name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 every Monday, Wednesday, and Friday
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
